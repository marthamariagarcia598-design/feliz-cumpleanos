<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños, Mi Amor! ❤️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Tarjeta Principal */
        .card {
            background: rgba(255, 255, 255, 0.9);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 450px;
            width: 90%;
            z-index: 10;
            backdrop-filter: blur(5px);
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            color: #ff3366;
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .sub-title {
            color: #555;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        /* Estilos para la Foto de tu amorcito */
        .photo-container {
            width: 140px;
            height: 140px;
            margin: 15px auto;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #ff3366;
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.3);
        }

        .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Corazón Latiendo */
        .heart {
            font-size: 40px;
            color: #e6005c;
            margin: 10px 0;
            animation: beat 1s infinite alternate;
            display: inline-block;
        }

        @keyframes beat {
            to {
                transform: scale(1.25);
            }
        }

        p.message {
            color: #444;
            line-height: 1.6;
            font-size: 1rem;
            margin-bottom: 25px;
        }

        /* Botón de Sorpresa */
        .btn {
            background: linear-gradient(45deg, #ff3366, #ff6b81);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.4);
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 51, 102, 0.6);
        }

        /* Animación de Entrada */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Globos Flotantes */
        .balloon {
            position: absolute;
            bottom: -100px;
            width: 50px;
            height: 65px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            opacity: 0.8;
            animation: floatUp 8s infinite linear;
            z-index: 1;
        }

        .balloon::after {
            content: "";
            position: absolute;
            bottom: -12px;
            left: 23px;
            width: 2px;
            height: 15px;
            background: rgba(0, 0, 0, 0.2);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }

            100% {
                transform: translateY(-120vh) rotate(20deg);
                opacity: 0;
            }
        }

        /* Confeti */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            z-index: 5;
            animation: fall 4s infinite linear;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <!-- Tarjeta Cumpleañera -->
    <div class="card">
        <h1>¡Feliz Cumpleaños! 🎉</h1>
        <p class="sub-title">Para la persona más especial de mi vida</p>

        <!-- Contenedor de la Foto -->
        <div class="photo-container">
            <img src="Foto.jfif" alt="Mi Amor">
        </div>

        <div class="heart">❤️</div>

        <p class="message" id="textMessage">
            Hoy se celebra un año más de tu vida corazón. Gracias por llegar a mi vida.
            ¡Deseo que este nuevo año esté lleno de sueños cumplidos y siempre tengas salud!
            Muchas felicidades, mi amor. Te quiero muchooooo. 💖
        </p>

        <button class="btn" onclick="celebrate()">¡Haz clic aquí, amor! 🎁</button>
    </div>

    <!-- Generación de Animaciones con JS -->
    <script>
        // Crear Globos de colores variados
        const colors = ['#ff4d4d', '#ff9999', '#ff66cc', '#cc66ff', '#66b2ff', '#ffd700'];

        function createBalloons() {
            for (let i = 0; i < 15; i++) {
                let balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                balloon.style.left = Math.random() * 100 + 'vw';
                balloon.style.animationDuration = (Math.random() * 4 + 6) + 's';
                balloon.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(balloon);
            }
        }

        // Crear Confeti
        function createConfetti() {
            for (let i = 0; i < 40; i++) {
                let confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 3 + 's';
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0%';
                document.body.appendChild(confetti);
            }
        }

        // Acción al hacer clic en el botón
        function celebrate() {
            const message = document.getElementById('textMessage');
            message.innerHTML = "<strong>¡Eres lo mejor que me ha pasado! 💕<br>Te quiero muchísimo. ¡Que tengas bonito día hoy mi vida! 🥂✨</strong>";

            // Efecto extra de confeti al presionar el botón
            createConfetti();
        }

        // Iniciar animaciones al cargar
        createBalloons();
        createConfetti();
    </script>
</body>

</html>
